[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-quant"
version = "0.1.0"
description = "Research-first quantitative data foundation for Hermes Quant."
requires-python = ">=3.10,<3.15"
dependencies = [
    "openbb==4.7.2",
    "pandas>=2.2,<3",
    "polars>=1.15,<2",
    "pyarrow>=18,<20",
    "lightgbm>=4.5,<5",
    "scikit-learn>=1.5,<2",
    "pydantic>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
